<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F2A4A" />
    <meta name="robots" content="noindex" />
    <title>Anda sedang offline — Indotek Pro</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #0F172A;
        background: #F6F7F9;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        place-items: center;
      }

      main {
        width: min(100%, 440px);
        padding: 32px 24px;
        border: 1px solid #E3E7ED;
        border-radius: 20px;
        background: #FFFFFF;
        text-align: center;
        box-shadow: 0 16px 48px rgb(15 42 74 / 10%);
      }

      .brand {
        display: grid;
        width: 52px;
        height: 52px;
        margin: 0 auto 20px;
        place-items: center;
        border-radius: 16px;
        background: #F6F7F9;
      }

      .brand img { width: 100%; height: 100%; padding: 6px; object-fit: contain; }

      h1 { margin: 0; font-size: 22px; }
      p { margin: 12px 0 24px; color: #5B6676; font-size: 14px; line-height: 1.6; }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

      a, button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        border: 1px solid #CBD2DC;
        border-radius: 10px;
        background: #FFFFFF;
        color: #163A6A;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      button { border-color: #163A6A; background: #163A6A; color: #FFFFFF; }
      button:focus-visible, a:focus-visible { outline: 3px solid #F59E0B; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-hidden="true"><img src="/app-logo.png" alt="" /></div>
      <h1>Anda sedang offline</h1>
      <p id="offline-message" role="status" aria-live="polite">
        Koneksi internet tidak tersedia. Periksa jaringan Anda, lalu coba buka kembali Indotek Pro.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Coba lagi</button>
        <a href="/">Buka Indotek Pro</a>
      </div>
    </main>
    <script>
      const message = document.getElementById('offline-message');
      window.addEventListener('online', () => {
        message.textContent = 'Koneksi kembali tersedia. Anda dapat mencoba membuka Indotek Pro.';
      });
    </script>
  </body>
</html>
